<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>FoodCheck Scanner</title>

  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: #f6f7f9;
      color: #202124;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 8px 0 4px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #5f6368;
      margin-bottom: 18px;
      font-size: 15px;
    }

    .scanner-card {
      background: white;
      border-radius: 18px;
      padding: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .video-wrap {
      position: relative;
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
      background: #111;
    }

    #video {
      display: block;
      width: 100%;
      min-height: 300px;
      max-height: 520px;
      object-fit: cover;
      background: #111;
    }

    .scan-box {
      pointer-events: none;
      position: absolute;
      left: 7%;
      right: 7%;
      top: 37%;
      height: 26%;
      border: 4px solid rgba(255,255,255,0.95);
      border-radius: 10px;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.18);
    }

    .scan-guide {
      margin-top: 12px;
      text-align: center;
      color: #555;
      font-size: 14px;
    }

    .buttons {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    button,
    .photo-button {
      width: 100%;
      min-height: 50px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    #startButton {
      background: #2f6fed;
      color: white;
    }

    #stopButton {
      background: #eceff3;
      color: #222;
      display: none;
    }

    .photo-button {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eceff3;
      color: #222;
    }

    #photoInput {
      display: none;
    }

    #photoPreview {
      display: none;
      max-width: 100%;
      margin-top: 12px;
      border-radius: 12px;
    }

    #status {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: white;
      text-align: center;
      line-height: 1.4;
    }

    #barcodeValue {
      margin-top: 6px;
      font-size: 22px;
      font-weight: bold;
      word-break: break-all;
    }

    .success {
      background: #e7f6ec !important;
      color: #126b32;
    }

    .error {
      background: #fdecec !important;
      color: #9b1c1c;
    }

    .tip {
      margin-top: 14px;
      padding: 12px;
      background: #fff;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      color: #555;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>FoodCheck</h1>

  <div class="subtitle">
    Scan the barcode on a food product
  </div>

  <div class="scanner-card">

    <div class="video-wrap">
      <video
        id="video"
        autoplay
        muted
        playsinline
      ></video>

      <div class="scan-box"></div>
    </div>

    <div class="scan-guide">
      Keep the complete barcode inside the white rectangle.
    </div>

    <div class="buttons">

      <button id="startButton">
        Start Camera Scanner
      </button>

      <button id="stopButton">
        Stop Camera
      </button>

      <label class="photo-button" for="photoInput">
        Scan Barcode From Photo
      </label>

      <input
        id="photoInput"
        type="file"
        accept="image/*"
      >

    </div>

    <img id="photoPreview" alt="Barcode preview">

  </div>

  <div id="status">
    Tap <strong>Start Camera Scanner</strong>.
  </div>

  <div class="tip">
    Start around 20–30 cm away. Keep the barcode flat, well lit,
    and fully visible. Slowly move closer only if necessary.
  </div>

</div>

<script>
  const video = document.getElementById("video");
  const startButton = document.getElementById("startButton");
  const stopButton = document.getElementById("stopButton");
  const photoInput = document.getElementById("photoInput");
  const photoPreview = document.getElementById("photoPreview");
  const statusBox = document.getElementById("status");

  const codeReader =
    new ZXingBrowser.BrowserMultiFormatReader();

  let controls = null;
  let alreadyScanned = false;


  function showMessage(message) {
    statusBox.className = "";
    statusBox.innerHTML = message;
  }


  function showError(message) {
    statusBox.className = "error";
    statusBox.innerHTML = message;
  }


  function showBarcode(barcode) {
    statusBox.className = "success";

    statusBox.innerHTML =
      "Barcode scanned successfully:" +
      '<div id="barcodeValue">' +
      barcode +
      "</div>";
  }


  async function stopCamera() {
    if (controls) {
      try {
        controls.stop();
      } catch (error) {
        console.log(error);
      }
    }

    controls = null;

    startButton.style.display = "block";
    stopButton.style.display = "none";
  }


  startButton.addEventListener(
    "click",
    async function () {

      alreadyScanned = false;

      showMessage(
        "Starting rear camera..."
      );

      try {

        const constraints = {
          audio: false,

          video: {
            facingMode: {
              ideal: "environment"
            },

            width: {
              ideal: 1920
            },

            height: {
              ideal: 1080
            }
          }
        };

        controls =
          await codeReader.decodeFromConstraints(
            constraints,
            video,
            async function (
              result,
              error,
              controlsFromCallback
            ) {

              if (!result) {
                return;
              }

              if (alreadyScanned) {
                return;
              }

              alreadyScanned = true;

              const barcode =
                String(
                  result.getText()
                ).trim();

              showBarcode(barcode);

              try {
                controlsFromCallback.stop();
              } catch (error) {
                console.log(error);
              }

              controls = null;

              startButton.style.display = "block";
              stopButton.style.display = "none";
            }
          );

        startButton.style.display = "none";
        stopButton.style.display = "block";

        showMessage(
          "Camera ready. Point it at the product barcode."
        );

      } catch (error) {

        console.error(error);

        showError(
          "Could not start the camera. Check camera permission and try again."
        );

      }
    }
  );


  stopButton.addEventListener(
    "click",
    async function () {
      await stopCamera();

      showMessage(
        "Camera stopped."
      );
    }
  );


  photoInput.addEventListener(
    "change",
    async function (event) {

      const file =
        event.target.files[0];

      if (!file) {
        return;
      }

      await stopCamera();

      alreadyScanned = false;

      showMessage(
        "Scanning barcode from photo..."
      );

      const objectUrl =
        URL.createObjectURL(file);

      photoPreview.src =
        objectUrl;

      photoPreview.style.display =
        "block";

      try {

        const result =
          await codeReader.decodeFromImageUrl(
            objectUrl
          );

        const barcode =
          String(
            result.getText()
          ).trim();

        showBarcode(barcode);

      } catch (error) {

        console.error(error);

        showError(
          "No barcode was detected in that image. Try another photo with the barcode sharp and fully visible."
        );

      } finally {

        photoInput.value = "";

        setTimeout(
          function () {
            URL.revokeObjectURL(
              objectUrl
            );
          },
          1000
        );

      }
    }
  );
</script>

</body>
</html>
